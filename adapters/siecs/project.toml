[project]
id = "siecs"
name = "Siecs"
language = "C"
version = "6aa755f"
url = "https://github.com/suleymanlaarabi/siecs"
enabled = true

[build]
cwd = "{root}"
# Use the sibling checkout only when clean and at the pinned commit; otherwise
# the preparation script clones the pinned version into the build cache.
commands = [
  ["bash", "tools/prepare_siecs_source.sh", "{root}/../siecs"],
  ["cmake", "-S", "adapters/siecs", "-B", "build/siecs", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release", "-DSIECS_ROOT={root}/../siecs"],
  ["cmake", "--build", "build/siecs", "--config", "Release"],
]

[run]
binary = "build/siecs/siecs-bench"
command = ["{binary}"]
workloads = ["entity_cycle", "add_remove", "iterate"]

# SIECS_DEV=1 ./bench ... benchmarks the sibling ../siecs working tree as is.
# Its amalgamation is regenerated into build/siecs-dev, nothing in ../siecs is
# touched, and results are not published.
[dev]
env = "SIECS_DEV"
version = "dev"
commands = [
  ["bash", "{root}/tools/siecs_distr.sh", "{root}/../siecs", "{root}/build/siecs-dev"],
]
environment = { SIECS_DISTR_ROOT = "{root}/build/siecs-dev", SIECS_BENCH_VERSION = "dev" }
