[project]
id = "flecs"
name = "Flecs"
language = "C"
version = "4.1.5"
url = "https://github.com/SanderMertens/flecs"
enabled = true

[build]
cwd = "{root}"
commands = [
  ["cmake", "-S", "adapters/flecs", "-B", "build/flecs", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=Release"],
  ["cmake", "--build", "build/flecs", "--config", "Release"],
]

[run]
binary = "build/flecs/flecs-bench"
command = ["{binary}"]
workloads = ["entity_cycle", "add_remove", "iterate"]
